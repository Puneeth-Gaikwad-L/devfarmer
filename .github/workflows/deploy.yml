name: Deploy to Hostinger

on:
  push:
    branches:
      - main   # or master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run linting (if configured)
        run: |
          if npm run lint --silent 2>/dev/null; then
            npm run lint
          else
            echo "No linting script found, skipping..."
          fi
        continue-on-error: false

      - name: Build React app
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Dist directory not found!"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "index.html not found in dist directory!"
            exit 1
          fi
          echo "Build verification successful!"
          ls -la dist/

      - name: Add SSH key and known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 65002 -H 82.180.142.62 >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /home/u308657034/domains/devfarmer.xyz/public_html
          remote_host: 82.180.142.62
          remote_port: 65002
          remote_user: u308657034
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Deployment success notification
        run: echo "🚀 Deployment completed successfully!"